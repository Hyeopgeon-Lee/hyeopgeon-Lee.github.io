name: Build, validate and deploy SEO-ready Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SEO validator
        run: python -m pip install 'lxml>=5,<7'
      - name: Derive actual modification dates from Git history
        run: python tools/prepare_seo.py
      - name: Build Jekyll
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec jekyll build --trace
      - name: Validate all indexable pages and discovery documents
        run: python tools/audit_seo.py --site _site --strict --output seo-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: seo-build-audit
          path: seo-audit.json
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4

  discovery:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'lxml>=5,<7'
      - name: Confirm published revision, validate live URLs and notify IndexNow
        run: python tools/notify_indexnow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-live-audit
          path: seo-audit.json
