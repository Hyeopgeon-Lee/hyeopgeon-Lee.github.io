<!-- 헤드 include: _layouts/default.html 안의 <head> 내부에 포함됩니다 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WN99333WLX"></script>
<script defer src="{{ '/assets/js/analytics.js' | relative_url }}"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
{% assign asset_version = site.github.build_revision %}
{% unless asset_version %}
  {% assign asset_version = site.time | date: "%s" %}
{% endunless %}
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}?v={{ asset_version }}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
<meta name="theme-color" content="#091e3a">
